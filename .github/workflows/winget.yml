name: Update WinGet

on:
  release:
    types: [published]

permissions: {}

jobs:
  submit:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - name: Submit release to WinGet
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $release = (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).release
          $version = $release.tag_name -replace '^[vV]', ''
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$($release.tag_name)"
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe -ErrorAction Stop
          .\wingetcreate.exe update nohuto.RegKit `
            --version $version `
            --urls "$base/RegKit-Setup-$version-x64.exe|x64" "$base/RegKit-Setup-$version-x86.exe|x86" `
            --release-notes-url $release.html_url `
            --submit --no-open
          exit $LASTEXITCODE
